# Definimos o nome do WORKFLOW que irá aparecer na Actions do github
name: StreamFlux CI/CD

# O 'on' é o gatilho (trigger) que inicia a execução automatica quando tem um push ou um pull_request nos diretorios de Dados/netflix, onde tem codigo Frontend e Backend e no github/workflows/ci-cd.yml, que é esse arquivo nas alterações do CI/CD ele faz a verificação se tudo certo. Tudo isso ocorre se as alterações forem enviadas para Branch main.
on:
  push:
    branches:
      - main
    paths:
      - "Dados/netflix/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Dados/netflix/**"
      - ".github/workflows/ci-cd.yml"

# O 'jobs' define as seções que serão executadas quando o 'on' for ativo. Com a criação de maquinas ubuntu, baixando o codigo da branch main para push e pega a branch do PR quando é feito um pull_request para a maquina virtual, faz as devidas configurações de linguagens (node e python), instala as devidas dependencias (npm ci e python -m pip install -r requirements.txt) e faz o build (npm run build e python -m compileall -q .) de cada job.
jobs:
  frontend:
    name: CI Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dados/netflix/netflix-front

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Dados/netflix/netflix-front/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar Lint
        run: npm run lint

      - name: Gerar build da aplicacao
        run: npm run build

  backend:
    name: CI Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dados/netflix/Script

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Dados/netflix/Script/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar sintaxe do Python
        run: python -m compileall -q .

  # Já na parte de 'deploy' é aonde ocorre o CD, fazendo o deploy de forma automatica para a VERCEL e o RENDER para atualizar produção. O needs garante que o deploy so rode depois que os jobs de Frontend e Backend deram sucesso.
  deploy:
    name: Deploy StreamFlux
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Frontend na Vercel
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Deploy Backend no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            "$RENDER_DEPLOY_HOOK_URL"
